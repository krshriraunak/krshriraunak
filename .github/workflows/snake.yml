name: Generate Purple Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Purple Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%238B5CF6&color_dots=%2316102B,%23312E81,%234C1D95,%236D28D9,%23A78BFA
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23A78BFA&color_dots=%2316102B,%23312E81,%234C1D95,%236D28D9,%23A78BFA

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
